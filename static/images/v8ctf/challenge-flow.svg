<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How the v8CTF challenge works</title>
  <desc id="desc">The researcher sends an exploit URL, a pinned Chrome opens it, and a successful exploit prints the flag.</desc>
  <rect width="1200" height="520" rx="20" fill="#0b0f0c"/>
  <text x="70" y="70" fill="#f4f7f4" font-family="Arial,sans-serif" font-size="34" font-weight="700">the entire challenge in one request</text>
  <text x="70" y="106" fill="#89a28e" font-family="Consolas,monospace" font-size="18">simple protocol. deeply unfriendly implementation detail.</text>
  <g font-family="Consolas,monospace" text-anchor="middle">
    <g><rect x="60" y="182" width="200" height="146" rx="14" fill="#122318" stroke="#58ff58" stroke-width="2"/><text x="160" y="238" fill="#58ff58" font-size="22">researcher</text><text x="160" y="274" fill="#b9c8bc" font-size="17">solve PoW</text><text x="160" y="302" fill="#b9c8bc" font-size="17">send HTTPS URL</text></g>
    <g><rect x="348" y="182" width="200" height="146" rx="14" fill="#122318" stroke="#58ff58" stroke-width="2"/><text x="448" y="238" fill="#58ff58" font-size="22">v8CTF</text><text x="448" y="274" fill="#b9c8bc" font-size="17">launch one</text><text x="448" y="302" fill="#b9c8bc" font-size="17">fresh target</text></g>
    <g><rect x="636" y="182" width="200" height="146" rx="14" fill="#122318" stroke="#ffca56" stroke-width="2"/><text x="736" y="230" fill="#ffca56" font-size="22">Chrome</text><text x="736" y="262" fill="#b9c8bc" font-size="16">150.0.7871.46</text><text x="736" y="292" fill="#b9c8bc" font-size="16">opens exploit page</text></g>
    <g><rect x="924" y="182" width="216" height="146" rx="14" fill="#58ff58"/><text x="1032" y="236" fill="#0b0f0c" font-size="22" font-weight="700">/flag/flag</text><text x="1032" y="274" fill="#16331c" font-size="16">open + read</text><text x="1032" y="302" fill="#16331c" font-size="16">print to output</text></g>
  </g>
  <g fill="none" stroke-width="3"><path d="M270 255H336" stroke="#58ff58"/><path d="m326 246 12 9-12 9" stroke="#58ff58"/><path d="M558 255H624" stroke="#58ff58"/><path d="m614 246 12 9-12 9" stroke="#58ff58"/><path d="M846 255H912" stroke="#ffca56"/><path d="m902 246 12 9-12 9" stroke="#ffca56"/></g>
  <path d="M1032 346C1032 424 160 424 160 346" fill="none" stroke="#416b48" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="m151 356 9-12 9 12" fill="none" stroke="#416b48" stroke-width="2"/>
  <text x="596" y="463" text-anchor="middle" fill="#89a28e" font-family="Consolas,monospace" font-size="18">the flag comes back in Chrome's captured output</text>
</svg>
