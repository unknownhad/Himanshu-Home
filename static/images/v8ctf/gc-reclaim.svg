<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Garbage collection reclaim used by the exploit</title>
  <desc id="desc">A missing remembered edge allows a HeapNumber to be reclaimed and replaced with an attacker-shaped fake array.</desc>
  <rect width="1200" height="580" rx="20" fill="#0b0f0c"/>
  <text x="70" y="68" fill="#f4f7f4" font-family="Arial,sans-serif" font-size="34" font-weight="700">garbage collection became part of the exploit</text>
  <g font-family="Consolas,monospace">
    <text x="76" y="128" fill="#58ff58" font-size="19">1 / before minor GC</text><text x="452" y="128" fill="#ffca56" font-size="19">2 / edge is forgotten</text><text x="824" y="128" fill="#ff8a65" font-size="19">3 / spray wins the slot</text>
    <g transform="translate(70 160)"><rect width="300" height="270" rx="14" fill="#122318" stroke="#285d32"/><rect x="28" y="40" width="116" height="72" rx="8" fill="#17351e" stroke="#58ff58"/><text x="86" y="70" text-anchor="middle" fill="#58ff58" font-size="16">old</text><text x="86" y="94" text-anchor="middle" fill="#d5e3d7" font-size="15">JSRegExp</text><rect x="178" y="40" width="96" height="72" rx="8" fill="#1f2116" stroke="#ffca56"/><text x="226" y="70" text-anchor="middle" fill="#ffca56" font-size="15">young</text><text x="226" y="94" text-anchor="middle" fill="#d5e3d7" font-size="14">number</text><path d="M145 76H171" stroke="#58ff58" stroke-width="3"/><text x="150" y="150" fill="#89a28e" font-size="14">lastIndex points here</text><text x="150" y="178" fill="#ff8a65" font-size="14">write barrier missing</text></g>
    <g transform="translate(450 160)"><rect width="300" height="270" rx="14" fill="#171713" stroke="#8a7b39"/><rect x="28" y="40" width="116" height="72" rx="8" fill="#17351e" stroke="#58ff58"/><text x="86" y="70" text-anchor="middle" fill="#58ff58" font-size="16">old</text><text x="86" y="94" text-anchor="middle" fill="#d5e3d7" font-size="15">JSRegExp</text><rect x="178" y="40" width="96" height="72" rx="8" fill="#221716" stroke="#ff8a65" stroke-dasharray="6 5"/><text x="226" y="70" text-anchor="middle" fill="#ff8a65" font-size="15">free</text><text x="226" y="94" text-anchor="middle" fill="#d5e3d7" font-size="14">slot</text><path d="M145 76H171" stroke="#ff8a65" stroke-width="3" stroke-dasharray="5 4"/><text x="150" y="150" fill="#89a28e" font-size="14">the pointer survives</text><text x="150" y="178" fill="#ff8a65" font-size="14">the object does not</text></g>
    <g transform="translate(830 160)"><rect width="300" height="270" rx="14" fill="#211713" stroke="#ff8a65"/><rect x="28" y="40" width="116" height="72" rx="8" fill="#17351e" stroke="#58ff58"/><text x="86" y="70" text-anchor="middle" fill="#58ff58" font-size="16">old</text><text x="86" y="94" text-anchor="middle" fill="#d5e3d7" font-size="15">JSRegExp</text><rect x="170" y="32" width="112" height="88" rx="8" fill="#312019" stroke="#ff8a65"/><text x="226" y="62" text-anchor="middle" fill="#ff8a65" font-size="15">fake</text><text x="226" y="86" text-anchor="middle" fill="#f4f7f4" font-size="15">JSArray</text><text x="226" y="106" text-anchor="middle" fill="#89a28e" font-size="12">map|props|elem|len</text><path d="M145 76H163" stroke="#ff8a65" stroke-width="3"/><text x="150" y="150" fill="#89a28e" font-size="14">same address</text><text x="150" y="178" fill="#58ff58" font-size="14">new interpretation</text></g>
  </g>
  <text x="600" y="502" text-anchor="middle" fill="#b9c8bc" font-family="Consolas,monospace" font-size="18">old IE called this heap spraying. V8 makes you negotiate with generations first.</text>
</svg>
