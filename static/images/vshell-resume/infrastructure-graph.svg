    <text x="100" y="622" fill="#c8d7df" font-size="18">ANY.RUN: VShell detection</text>
    <text x="100" y="654" fill="#c8d7df" font-size="18">Exact-IP search: this task only</text>
    <rect x="100" y="672" width="188" height="34" rx="17" fill="#173f4b"/><text x="122" y="695" fill="#38e8b0" font-size="15">HIGH CONFIDENCE</text>

