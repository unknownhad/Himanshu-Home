    <text x="970" y="515" fill="#f6fbff" font-size="25" font-weight="700">Named actor links</text>
    <text x="970" y="558" fill="#f6c7cb" font-size="18">UNC5174: tooling only</text>
    <text x="970" y="590" fill="#f6c7cb" font-size="18">Earth Lamia: tooling only</text>
    <text x="970" y="622" fill="#f6c7cb" font-size="18">UAT-8302: tooling only</text>
    <text x="970" y="654" fill="#f6c7cb" font-size="18">UNC6586: tooling only</text>
    <rect x="970" y="672" width="254" height="34" rx="17" fill="#4c2630"/><text x="992" y="695" fill="#ff9ca4" font-size="15">INSUFFICIENT EVIDENCE</text>

    <path d="M590 365 C480 415 340 425 265 470" fill="none" stroke="#38e8b0" stroke-width="5"/>
    <path d="M700 365 V470" fill="none" stroke="#91a8b8" stroke-width="4" stroke-dasharray="12 10"/>
    <path d="M810 365 C920 415 1060 425 1135 470" fill="none" stroke="#ff6d78" stroke-width="4" stroke-dasharray="12 10"/>

    <rect x="70" y="770" width="1260" height="48" rx="14" fill="#081721" stroke="#2c5363"/>
    <text x="700" y="801" text-anchor="middle" fill="#c8d7df" font-size="18">Repeated VShell use of an IP supports family continuity. It does not identify who controlled the server.</text>
