      <rect x="70" y="470" width="390" height="245" rx="22" fill="#102b38" stroke="#2c5363"/>
      <rect x="510" y="470" width="380" height="245" rx="22" fill="#102b38" stroke="#2c5363"/>
      <rect x="940" y="470" width="390" height="245" rx="22" fill="#261f2b" stroke="#ff6d78" stroke-width="2"/>
    </g>

    <text x="700" y="220" text-anchor="middle" fill="#38e8b0" font-size="18" font-weight="700">CONFIRMED CAMPAIGN C2</text>
    <text x="700" y="270" text-anchor="middle" fill="#f6fbff" font-size="30" font-weight="700">38.207.178[.]192</text>
