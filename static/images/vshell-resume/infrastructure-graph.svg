    <text x="540" y="590" fill="#c8d7df" font-size="18">oa.muxmyee520[.]shop</text>
    <text x="540" y="622" fill="#c8d7df" font-size="18">d.d.edsxhbba06[.]shop</text>
    <text x="540" y="654" fill="#c8d7df" font-size="18">v.n.1.xcwanmei09[.]shop</text>
