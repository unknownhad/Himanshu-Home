    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="860" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
